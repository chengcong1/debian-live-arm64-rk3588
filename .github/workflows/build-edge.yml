name: Build edge (Armbian 7.x kernel, no Armbian framework)

# Second flavour of the Rock 5B live ISO:
#   Debian trixie + KDE Plasma 6 (full) + Armbian *edge* kernel (7.x)
#   without any Armbian framework package (no armbian-firmware / BSP / config),
#   firmware and userspace are plain Debian.
# See lb-config-trixie-edge.sh and additional-packages.trixie-edge.
on:
  push:
    branches:
      - main
    paths:
      - 'lb-config-trixie-edge.sh'
      - 'additional-packages.trixie-edge'
      - 'customize-chroot-trixie.hook.chroot'
      - '10_linux'
      - 'networkmanager.yaml'
      - '*.patch'
      - '.github/workflows/build-edge.yml'
  workflow_dispatch:

jobs:
  prepare_release:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Get time
        id: time
        uses: nanzm/get-time-action@v1.1
        with:
          format: 'YYYYMMDD-HHmm'
      - name: Create empty release
        id: release
        uses: softprops/action-gh-release@v1
        with:
          # distinct tag prefix so the two workflows never race for one tag
          tag_name: edge-${{ steps.time.outputs.time }}
          body_path: README.md
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
    outputs:
      release_id: ${{ steps.release.outputs.id }}
  build:
    runs-on: ubuntu-24.04-arm
    needs: prepare_release
    steps:
      - name: Install deb deps
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: devscripts build-essential debhelper po4a gettext debootstrap libnss-mymachines live-boot-doc live-config-doc live-manual-html systemd-container qemu-user-static debian-archive-keyring
          version: 1.0
      - name: Checkout
        uses: actions/checkout@v3
      - name: Build live-build
        shell: bash
        run: |
          sudo apt update
          mkdir live-build && cd live-build
          git clone https://salsa.debian.org/live-team/live-build.git -b master --depth=1
          cd live-build
          sudo apt -y install debhelper po4a gettext devscripts build-essential
          patch -p1 < ../../0001-binary_linux-image-install-dtbs.patch
          patch -p1 < ../../grub-dtb.patch
          patch -p1 < ../../remove-raspi-firmware.patch
          dpkg-buildpackage -us -uc
          sudo apt -y install ../live-build_*_all.deb
      - name: Build live iso
        shell: bash
        run: |
          mkdir iso-build && cd iso-build
          cp ../lb-config-trixie-edge.sh lb-config.sh
          cp ../additional-packages.trixie-edge additional-packages
          cp ../networkmanager.yaml .
          # shared hook: no Armbian specific code in it, it only fixes the
          # arm64 Calamares/bootloader paths, sddm autologin, locales, the
          # /boot/dtb symlink and (guarded) the fcitx5 input method
          cp ../customize-chroot-trixie.hook.chroot customize-chroot.hook.chroot
          cp ../10_linux .
          chmod +x lb-config.sh
          ./lb-config.sh
          # apt-utils provides apt-ftparchive (used by lb binary_package-lists on
          # the host); the other tools are host-side fallbacks -- live-build
          # installs the chroot-side ones (xorriso, mtools, squashfs-tools,
          # grub-common) into the live chroot by itself.
          sudo apt -y install qemu-user-static debian-archive-keyring apt-utils squashfs-tools xorriso mtools dosfstools
          sudo lb build
      - name: Split the iso into <2 GiB parts for the release
        shell: bash
        run: |
          set -euo pipefail
          cd iso-build
          shopt -s nullglob
          isos=( *.iso )
          if [ "${#isos[@]}" -eq 0 ]; then
            echo "::error::no .iso file found in iso-build/"
            exit 1
          fi

          mkdir -p release-parts
          for iso in "${isos[@]}"; do
            rm -f "release-parts/${iso}.part"*
            # GitHub limits release assets to 2 GiB per file -> 1800 MiB parts
            split -b 1800M -d -a 2 "${iso}" "release-parts/${iso}.part"
            # checksum of the whole image (after reassembly) + of every part
            sha256sum "${iso}" > "release-parts/${iso}.sha256"
            ( cd release-parts && sha256sum "${iso}.part"* ) >> "release-parts/${iso}.sha256"
            # free disk space: the parts are what we ship
            rm -f "${iso}"
          done

          # reassembly instructions shipped with the release
          cat > release-parts/RESTORE.txt << 'EOF'
          Rock 5B live ISO - uploaded in parts
          ====================================
          GitHub limits release assets to 2 GiB per file, so the image was
          split into 1800 MiB chunks named <image>.iso.part00, .part01, ...

          Reassemble and verify (Linux / macOS / WSL):

            cat <image>.iso.part* > <image>.iso
            sha256sum -c <image>.iso.sha256

          Windows (cmd.exe):

            copy /b <image>.iso.part00 + <image>.iso.part01 <image>.iso

          The .sha256 file lists the checksum of the reassembled image and of
          every single part:

            sha256sum -c <image>.iso.sha256

          Then flash the image to a USB stick / SD card (or drop it on a
          Ventoy stick) and boot the Rock 5B through UEFI.
          EOF

          ls -lh release-parts
      - name: Upload iso parts
        uses: xresloader/upload-to-github-release@v1
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_id: ${{ needs.prepare_release.outputs.release_id }}
          file: "iso-build/release-parts/*"
          draft: false
          overwrite: true
      - name: Rollback release
        if: failure()
        uses: author/action-rollback@stable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_id: ${{ needs.prepare_release.outputs.release_id }}
