name: Build
on:
  workflow_dispatch:

jobs:
  prepare_release:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Get time
        id: time
        uses: nanzm/get-time-action@v1.1
        with:
          format: 'YYYYMMDD-HHmm'
      - name: Create empty release
        id: release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.time.outputs.time }}
          body_path: README.md
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
    outputs:
      release_id: ${{ steps.release.outputs.id }}
  build:
    runs-on: ubuntu-24.04-arm
    needs: prepare_release
    strategy:
      matrix:
        # trixie = Armbian current kernel (6.18.x) + Debian 13 + KDE Plasma
        # add bookworm back here if you also want the old Debian 12 image
        CODENAME: [trixie]
    steps:
      - name: Install deb deps
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: devscripts build-essential debhelper po4a gettext debootstrap libnss-mymachines live-boot-doc live-config-doc live-manual-html systemd-container qemu-user-static debian-archive-keyring
          version: 1.0
      - name: Checkout
        uses: actions/checkout@v3
      - name: Build live-build
        shell: bash
        run: |
          sudo apt update
          mkdir live-build && cd live-build
          git clone https://salsa.debian.org/live-team/live-build.git -b master --depth=1
          cd live-build
          sudo apt -y install debhelper po4a gettext devscripts build-essential
          patch -p1 < ../../0001-binary_linux-image-install-dtbs.patch
          patch -p1 < ../../grub-dtb.patch
          patch -p1 < ../../remove-raspi-firmware.patch
          dpkg-buildpackage -us -uc
          sudo apt -y install ../live-build_*_all.deb
      - name: Build live iso
        shell: bash
        run: |
          mkdir iso-build && cd iso-build
          cp ../lb-config-${{ matrix.CODENAME }}.sh lb-config.sh
          cp ../additional-packages.${{ matrix.CODENAME }} additional-packages
          cp ../networkmanager.yaml .
          cp ../customize-chroot-${{ matrix.CODENAME }}.hook.chroot customize-chroot.hook.chroot
          cp ../10_linux .
          chmod +x lb-config.sh
          ./lb-config.sh
          # apt-utils provides apt-ftparchive (used by lb binary_package-lists on
          # the host); the other tools are host-side fallbacks -- live-build
          # installs the chroot-side ones (xorriso, mtools, squashfs-tools,
          # grub-common) into the live chroot by itself.
          sudo apt -y install qemu-user-static debian-archive-keyring apt-utils squashfs-tools xorriso mtools dosfstools
          sudo lb build
      - name: Package the iso for the release
        shell: bash
        run: |
          set -euo pipefail
          cd iso-build
          shopt -s nullglob

          isos=( *.iso )
          if [ "${#isos[@]}" -eq 0 ]; then
            echo "::error::no .iso file found in iso-build/"
            exit 1
          fi

          out=release-parts
          part_size=1800M                     # GitHub allows at most 2 GiB per asset
          single_max=$((1900 * 1024 * 1024))  # below that the image is shipped as-is
          mkdir -p "${out}"

          for iso in "${isos[@]}"; do
            echo "::group::Packaging ${iso} ($(du -h -- "${iso}" | cut -f1))"
            rm -f -- "${out}/${iso}" "${out}/${iso}".part[0-9][0-9]

            if [ "$(stat -c%s -- "${iso}")" -le "${single_max}" ]; then
              # small enough for a single asset
              mv -- "${iso}" "${out}/${iso}"
              ( cd "${out}" && sha256sum -- "${iso}" ) > "${out}/${iso}.sha256"
              echo "shipped as one file"
            else
              split -b "${part_size}" -d -a 2 -- "${iso}" "${out}/${iso}.part"

              # the parts must reassemble into the image bit for bit
              image_sum=$(sha256sum -- "${iso}" | cut -d' ' -f1)
              parts_sum=$(cat -- "${out}/${iso}".part[0-9][0-9] | sha256sum | cut -d' ' -f1)
              if [ "${image_sum}" != "${parts_sum}" ]; then
                echo "::error::parts of ${iso} do not reassemble into the original image"
                exit 1
              fi

              # line 1 = reassembled image, then one line per uploaded part
              {
                echo "${image_sum}  ${iso}"
                ( cd "${out}" && sha256sum -- "${iso}".part[0-9][0-9] )
              } > "${out}/${iso}.sha256"

              rm -f -- "${iso}"                # the parts are what we ship
              parts=$(ls -1 -- "${out}/${iso}".part[0-9][0-9] | wc -l)
              echo "split into ${parts} parts"
            fi

            echo "::endgroup::"
          done

          # shipped inside the release next to the assets
          cat > "${out}/RESTORE.txt" << 'EOF'
          Rock 5B live ISO release
          ========================
          GitHub allows at most 2 GiB per release asset. A bigger image is
          uploaded as <image>.iso.part00, <image>.iso.part01, ... and an image
          that fits is uploaded as plain <image>.iso.
          If you only see a single .iso file, just use it.

          Reassemble and verify the parts (Linux / macOS / WSL):

            cat <image>.iso.part* > <image>.iso
            sha256sum -c <image>.iso.sha256

          Windows (cmd.exe):

            copy /b <image>.iso.part00 + <image>.iso.part01 <image>.iso

          <image>.iso.sha256 holds the checksum of every uploaded file and, for
          split images, the checksum of the reassembled image on line 1:

            sha256sum -c <image>.iso.sha256

          Then flash the image to a USB stick / SD card (or drop it on a Ventoy
          stick) and boot the Rock 5B through UEFI.
          EOF

          ls -lh -- "${out}"
      - name: Upload iso assets
        uses: xresloader/upload-to-github-release@v1
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_id: ${{ needs.prepare_release.outputs.release_id }}
          file: "iso-build/release-parts/*"
          draft: false
          overwrite: true
      - name: Rollback release
        if: failure()
        uses: author/action-rollback@stable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_id: ${{ needs.prepare_release.outputs.release_id }}
